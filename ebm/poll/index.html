<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>即時投票</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="../config.js"></script>
<script>
  var KICKER   = "先問大家一個問題";
  var QUESTION = "AI 那麼厲害了，\n還需要學查文獻嗎？";
  var OPTIONS  = ["需要", "不需要"];
</script>
<style>
:root{
  --grad:linear-gradient(100deg,#BF4F6C 0%,#D7755F 52%,#EDBE8E 100%);
  --cream:#FFFAF6; --ink:#2B1B17; --coral:#C8553A; --rose:#B23A5E; --tint:#FBEDE4;
  --line:#EFDDD2; --body:#5A4640; --muted:#7A665F; --peach:#FFE9D6;
  --sans:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;font-family:var(--sans);color:var(--ink);background:var(--cream);-webkit-font-smoothing:antialiased}
button{font:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
.hidden{display:none!important}

/* ---------- 學員手機畫面 ---------- */
.voter{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;background:var(--grad);color:#fff;
  padding:calc(28px + env(safe-area-inset-top,0)) 22px calc(28px + env(safe-area-inset-bottom,0))}
.voter .kicker{font-size:16px;font-weight:700;letter-spacing:.2em;color:var(--peach);margin:0 0 12px}
.voter h1{font-size:clamp(30px,8.4vw,44px);font-weight:900;line-height:1.25;margin:0 0 28px;text-wrap:balance}
.opts{display:flex;flex-direction:column;gap:14px}
.opt{width:100%;min-height:76px;padding:18px 22px;border-radius:18px;border:3px solid transparent;
  background:var(--cream);color:var(--ink);font-size:24px;font-weight:900;text-align:left;
  display:flex;align-items:center;justify-content:space-between;gap:12px;transition:transform .08s}
.opt:active{transform:scale(.98)}
.opt[aria-pressed="true"]{background:var(--ink);color:var(--cream);border-color:var(--peach)}
.opt .tick{font-size:22px;opacity:0}
.opt[aria-pressed="true"] .tick{opacity:1}
.opt:disabled{opacity:.55;cursor:default}
.msg{min-height:56px;margin:18px 0 0;font-size:17px;line-height:1.5;color:#fff}
.msg b{font-weight:900}
.foot{margin-top:14px;font-size:13px;color:var(--peach);opacity:.9}

/* ---------- 主持人投影畫面（外觀比照簡報第 2 頁） ---------- */
.host{min-height:100vh;min-height:100dvh;align-content:center;display:grid;grid-template-columns:minmax(0,1fr) clamp(240px,24vw,400px);gap:clamp(24px,4vw,72px);
  padding:clamp(28px,6.6vw,128px);align-items:center;background:var(--grad);color:#F3F6F5}
.host .kicker{font-size:clamp(16px,1.67vw,32px);font-weight:700;letter-spacing:.14em;color:var(--peach);margin:0 0 .6em}
.host h1{font-size:clamp(34px,5.4vw,104px);font-weight:900;line-height:1.2;margin:0 0 .55em;color:#F3F6F5}
.bars{display:flex;flex-direction:column;gap:clamp(12px,1.4vw,26px)}
.bar{display:grid;grid-template-columns:minmax(4.2em,auto) 1fr minmax(5.4em,auto);align-items:center;gap:clamp(12px,1.4vw,28px)}
.bar .label{font-size:clamp(22px,2.5vw,48px);font-weight:900;color:#FFF6EE}
.track{height:clamp(44px,4.6vw,88px);background:rgba(60,25,25,.28);border-radius:16px;overflow:hidden}
.fill{height:100%;width:0;border-radius:16px;background:#FFF6EE;transition:width .6s cubic-bezier(.2,.8,.2,1)}
.bar .num{font-size:clamp(20px,2.4vw,46px);font-weight:900;text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap;color:#FFF6EE}
.bar .num small{font-size:.58em;font-weight:700;color:var(--peach);margin-left:.4em}
.total{margin:clamp(16px,1.8vw,34px) 0 0;font-size:clamp(18px,1.7vw,32px);color:#FFF6EE}
.total b{font-variant-numeric:tabular-nums}
.side{display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center}
.qrbox{width:100%;background:#fff;border-radius:20px;padding:16px}
.qrbox #qr img,.qrbox #qr canvas{width:100%!important;height:auto!important;display:block}
.qrbox p{color:var(--ink);margin:0}
.side .scan{font-size:clamp(18px,1.9vw,36px);font-weight:900;margin:0;color:#FFF6EE}
.side .url{font-size:clamp(12px,.95vw,18px);color:#3A1620;word-break:break-all;margin:0}
.ctrl{position:fixed;left:clamp(28px,6.6vw,128px);right:clamp(28px,6.6vw,128px);bottom:clamp(14px,2.4vw,44px);display:flex;flex-wrap:wrap;gap:10px;align-items:center;opacity:.5;transition:opacity .2s}
.ctrl:hover,.ctrl:focus-within{opacity:1}
.ctrl button{padding:8px 16px;border-radius:999px;border:0;background:rgba(60,25,25,.38);color:#FFF6EE;font-size:14px;font-weight:700}
.ctrl button:hover{background:rgba(60,25,25,.62)}
.ctrl .state{margin-left:auto;font-size:14px;color:#3A1620}
.veil .fill{width:0!important}
.veil .num{visibility:hidden}
@media (max-width:820px){ .host{grid-template-columns:1fr;padding-bottom:96px} .side{max-width:320px;margin:0 auto} }
@media (prefers-reduced-motion:reduce){ .fill,.opt{transition:none} }
.setup{padding:24px;max-width:560px;margin:10vh auto;font-size:18px;line-height:1.7}
</style>
</head>
<body>
<div id="app"></div>
<script>
(function(){
'use strict';
var params = new URLSearchParams(location.search);
var API = params.get('api') || API_URL;
var HOST = params.get('host') || '';
var app = document.getElementById('app');
var COLORS = ['#A8425E','#C8553A','#D7755F','#BF4F6C','#E08C6C','#8E3550'];
var QTEXT = QUESTION.replace(/\n/g,'');
function qHtml(){return QUESTION.split('\n').map(esc).join('<br>')}
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}

if(API.indexOf('請貼上')>-1){
  app.innerHTML='<div class="setup"><h2>尚未設定後台網址</h2><p>請打開 index.html，把 Apps Script 部署網址貼到 <code>API_URL</code>。</p></div>';
  return;
}
function post(body){
  return fetch(API,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(body),redirect:'follow'}).then(function(r){return r.json()});
}
function getState(key){
  var u = API+(API.indexOf('?')>-1?'&':'?')+'action=state'+(key?'&key='+encodeURIComponent(key):'')+'&_='+Date.now();
  return fetch(u,{redirect:'follow'}).then(function(r){return r.json()});
}

/* ================= 學員 ================= */
function voter(){
  document.title = QTEXT;
  var store = {get:function(k){try{return localStorage.getItem(k)}catch(e){return null}}, set:function(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
  var token = store.get('poll_token');
  if(!token){ token = (Math.random().toString(36).slice(2)+Math.random().toString(36).slice(2)).slice(0,12); store.set('poll_token',token); }
  var mine = null, busy = false;
  app.innerHTML = '<main class="voter"><p class="kicker">'+esc(KICKER)+'</p><h1>'+qHtml()+'</h1>'+
    '<div class="opts" role="group" aria-label="選項">'+OPTIONS.map(function(o,i){
      return '<button class="opt" type="button" data-i="'+i+'" aria-pressed="false"><span>'+esc(o)+'</span><span class="tick" aria-hidden="true">✓</span></button>';
    }).join('')+'</div><p class="msg" id="msg" role="status" aria-live="polite">請選一個答案，匿名投票。</p>'+
    '<p class="foot">選完後請看大螢幕。想改答案，直接點另一個選項。</p></main>';
  var msg = document.getElementById('msg');
  var btns = [].slice.call(app.querySelectorAll('.opt'));
  function paint(){ btns.forEach(function(b,i){ b.setAttribute('aria-pressed', String(mine===i)); b.disabled = busy; }); }
  function send(i){
    if(busy) return; busy = true; var prev = mine; mine = i; paint(); msg.textContent = '送出中…';
    post({action:'vote',token:token,choice:i}).then(function(r){
      busy = false;
      if(r && r.ok){ store.set('poll_choice', r.round+':'+i); msg.innerHTML = '已收到，你選的是 <b>'+esc(OPTIONS[i])+'</b>。'; }
      else { mine = prev; msg.textContent = r && r.error==='closed' ? '投票已經截止，請看大螢幕。' : '沒有送出成功，請再點一次。'; }
      paint();
    }).catch(function(){ busy = false; mine = prev; paint(); msg.textContent = '網路不穩，沒有送出成功，請再點一次。'; });
  }
  btns.forEach(function(b){ b.addEventListener('click',function(){ send(Number(b.getAttribute('data-i'))); }); });
  // 回到頁面時，還原這一輪已經投過的選項
  getState('').then(function(s){
    var saved = (store.get('poll_choice')||'').split(':');
    if(s && s.ok && String(s.round)===saved[0] && saved[1]!==undefined){ mine = Number(saved[1]); paint(); msg.innerHTML = '你已經選了 <b>'+esc(OPTIONS[mine])+'</b>，可以改。'; }
    if(s && s.ok && !s.open){ msg.textContent = '投票已經截止，請看大螢幕。'; }
  }).catch(function(){});
}

/* ================= 主持人 ================= */
function host(){
  document.title = '投票結果｜'+QTEXT;
  var joinUrl = location.origin + location.pathname;
  var veil = params.get('hide')==='1', open = true, confirmReset = false, fails = 0;
  app.innerHTML = '<main class="host" id="host"><section><p class="kicker">'+esc(KICKER)+'</p><h1>'+qHtml()+'</h1>'+
    '<div class="bars">'+OPTIONS.map(function(o,i){
      return '<div class="bar"><div class="label">'+esc(o)+'</div><div class="track"><div class="fill" id="f'+i+'"></div></div><div class="num" id="n'+i+'">0<small>0%</small></div></div>';
    }).join('')+'</div><p class="total">已投票 <b id="total">0</b> 人<span id="closed"></span></p></section>'+
    '<aside class="side"><p class="scan">手機掃描投票</p><div class="qrbox"><div id="qr"></div></div><p class="url">'+esc(joinUrl)+'</p></aside>'+
    '<div class="ctrl"><button type="button" id="bVeil"></button><button type="button" id="bOpen"></button><button type="button" id="bReset">清除票數，重新開始</button><span class="state" id="st" role="status">連線中…</span></div></main>';
  try{ new QRCode(document.getElementById('qr'),{text:joinUrl,width:420,height:420,correctLevel:QRCode.CorrectLevel.M}); }
  catch(e){ document.getElementById('qr').innerHTML='<p>QR 產生失敗，請用下方網址</p>'; }
  var root = document.getElementById('host'), st = document.getElementById('st');
  var bVeil = document.getElementById('bVeil'), bOpen = document.getElementById('bOpen'), bReset = document.getElementById('bReset');
  function labels(){
    root.classList.toggle('veil', veil);
    bVeil.textContent = veil ? '公布結果' : '先隱藏結果';
    bOpen.textContent = open ? '截止投票' : '重新開放投票';
    document.getElementById('closed').textContent = open ? '' : '（已截止）';
  }
  function render(s){
    if(!s || !s.ok){ st.textContent = s && s.error==='bad_key' ? '主持人金鑰不正確' : '讀取失敗，重試中…'; return; }
    if(!s.counts){ st.textContent = '主持人金鑰不正確，無法顯示票數'; return; }
    open = s.open; var total = s.total||0;
    OPTIONS.forEach(function(o,i){
      var c = s.counts[i]||0, pct = total ? Math.round(c*100/total) : 0;
      document.getElementById('f'+i).style.width = (total ? c*100/total : 0)+'%';
      document.getElementById('n'+i).innerHTML = c+'<small>'+pct+'%</small>';
    });
    document.getElementById('total').textContent = total;
    st.textContent = '即時更新中';
    labels();
  }
  function tick(){
    getState(HOST).then(function(s){ fails = 0; render(s); }).catch(function(){ fails++; st.textContent = '網路不穩，重試中…'; })
      .then(function(){ setTimeout(tick, fails>3 ? 5000 : 2000); });
  }
  function cmd(c){ return post({action:'host',key:HOST,cmd:c}).then(render).catch(function(){ st.textContent='指令沒有送出，請再按一次'; }); }
  bVeil.addEventListener('click',function(){ veil = !veil; labels(); });
  bOpen.addEventListener('click',function(){ cmd(open?'close':'open'); });
  bReset.addEventListener('click',function(){
    if(!confirmReset){ confirmReset = true; bReset.textContent = '確定清除？再按一次'; setTimeout(function(){ confirmReset=false; bReset.textContent='清除票數，重新開始'; },4000); return; }
    confirmReset = false; bReset.textContent = '清除票數，重新開始'; cmd('reset');
  });
  labels(); tick();
}

if(HOST) host(); else voter();
})();
</script>
</body>
</html>
