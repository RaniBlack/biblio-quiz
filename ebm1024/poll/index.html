<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>即時作答</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap">
<script src="../config.js"></script>
<script>
  // 題目由簡報網站產生，請不要單獨修改；要換題目請重新產生整個網站。
  var POLLS = {"q1": {"kicker": "先問大家一個問題", "question": "AI 那麼厲害了，\n還需要學查文獻嗎？", "options": ["需要", "不需要"]}, "q4": {"kicker": "換你判斷 ｜ 拆概念", "question": "蔓越莓是否預防女性泌尿道感染？\n這是哪一類問題？", "options": ["A 治療 Therapy", "B 診斷 Diagnosis", "C 預後 Prognosis", "D 病因 Etiology"]}, "q2": {"kicker": "換你試試看 ｜ 第 1 題　組", "scene": "聽說醫護值班不能吃鳳梨（旺來），真的會比較忙嗎？", "question": "pineapple 和學名 Ananas comosus\n之間，用 OR 還是 AND？", "options": ["OR", "AND"]}, "q3": {"kicker": "換你試試看 ｜ 第 2 題　調", "scene": "聽說醫護值班不能吃鳳梨（旺來），真的會比較忙嗎？", "question": "只查到 17 筆，相關只有 1 篇，\n先做哪一個？", "options": ["補同義詞、放寬概念", "加文章類型篩選器"]}};
</script>
<style>
:root{
  --grad:linear-gradient(100deg,#BF4F6C 0%,#D7755F 52%,#EDBE8E 100%);
  --cream:#FFFAF6; --ink:#2B1B17; --peach:#FFE9D6;
  --sans:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;font-family:var(--sans);color:#fff;background:#BF4F6C;-webkit-font-smoothing:antialiased}
button{font:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
.voter{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;background:var(--grad);
  padding:calc(28px + env(safe-area-inset-top,0)) 22px calc(28px + env(safe-area-inset-bottom,0))}
.kicker{font-size:16px;font-weight:700;letter-spacing:.14em;color:var(--peach);margin:0 0 12px}
.scene{font-size:17px;line-height:1.5;color:var(--ink);background:rgba(255,250,246,.92);padding:12px 16px;border-radius:12px;margin:0 0 16px}
h1{font-size:clamp(26px,7.4vw,40px);font-weight:900;line-height:1.3;margin:0 0 24px;text-wrap:balance}
h1.long{font-size:clamp(23px,6.4vw,34px)}
.opts{display:flex;flex-direction:column;gap:14px}
.opt{width:100%;min-height:76px;padding:16px 20px;border-radius:18px;border:3px solid transparent;
  background:var(--cream);color:var(--ink);font-size:22px;font-weight:900;text-align:left;line-height:1.3;
  display:flex;align-items:center;justify-content:space-between;gap:12px;transition:transform .08s}
.opt:active{transform:scale(.98)}
.opt[aria-pressed="true"]{background:var(--ink);color:var(--cream);border-color:var(--peach)}
.opt .tick{font-size:22px;opacity:0}
.opt[aria-pressed="true"] .tick{opacity:1}
.opt:disabled{opacity:.55;cursor:default}
.msg{min-height:56px;margin:18px 0 0;font-size:17px;line-height:1.5}
.msg b{font-weight:900}
.foot{margin-top:14px;font-size:13px;color:var(--peach)}
.wait{margin:auto 0;font-size:20px;line-height:1.6;text-align:center}
.setup{padding:24px;max-width:560px;margin:10vh auto;font-size:18px;line-height:1.7;color:var(--ink);background:var(--cream)}
@media (prefers-reduced-motion:reduce){ .opt{transition:none} }
</style>
</head>
<body>
<div id="app"></div>
<script>
(function(){
'use strict';
var params = new URLSearchParams(location.search);
var API = params.get('api') || (typeof API_URL==='string' ? API_URL : '');
var app = document.getElementById('app');
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
if(!API || API.indexOf('請貼上')>-1){ app.innerHTML='<div class="setup"><h2>尚未設定後台網址</h2><p>請在 config.js 填入 Apps Script 部署網址。</p></div>'; return; }

var store = {get:function(k){try{return localStorage.getItem(k)}catch(e){return null}}, set:function(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
var token = store.get('poll_token');
if(!token){ token = (Math.random().toString(36).slice(2)+Math.random().toString(36).slice(2)).slice(0,12); store.set('poll_token',token); }

function post(body){return fetch(API,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(body),redirect:'follow'}).then(function(r){return r.json()})}
function getState(){return fetch(API+(API.indexOf('?')>-1?'&':'?')+'action=state&_='+Date.now(),{redirect:'follow'}).then(function(r){return r.json()})}

var cur = null;      // 目前顯示的題目代號
var mine = null;     // 這一題我選的選項
var busy = false, isOpen = true, round = null, fails = 0, timer = null;

app.innerHTML = '<main class="voter" id="v"><p class="wait" id="wait" role="status">連線中…</p></main>';
var root = document.getElementById('v');

function build(id){
  cur = id; mine = null;
  var P = POLLS[id];
  if(!P){ root.innerHTML = '<p class="wait" role="status">請看大螢幕，<br>下一題出現時這裡會自動更新。</p>'; document.title='即時作答'; return; }
  var q = P.question.replace(/\n/g,'');
  document.title = q;
  root.innerHTML = '<p class="kicker">'+esc(P.kicker)+'</p>'+(P.scene?'<p class="scene">問題：<b>'+esc(P.scene)+'</b></p>':'')+
    '<h1'+(q.length>18?' class="long"':'')+'>'+P.question.split('\n').map(esc).join('<br>')+'</h1>'+
    '<div class="opts" role="group" aria-label="選項">'+P.options.map(function(o,i){
      return '<button class="opt" type="button" data-i="'+i+'" aria-pressed="false"><span>'+esc(o)+'</span><span class="tick" aria-hidden="true">✓</span></button>';
    }).join('')+'</div><p class="msg" id="msg" role="status" aria-live="polite"></p>'+
    '<p class="foot">選完後請看大螢幕。想改答案，直接點另一個選項。換題時這一頁會自動更新。</p>';
  [].forEach.call(root.querySelectorAll('.opt'),function(b){ b.addEventListener('click',function(){ send(Number(b.getAttribute('data-i'))); }); });
}
function paint(){
  [].forEach.call(root.querySelectorAll('.opt'),function(b,i){ b.setAttribute('aria-pressed', String(mine===i)); b.disabled = busy || !isOpen; });
}
function say(html){ var m=document.getElementById('msg'); if(m) m.innerHTML = html; }
function idle(){
  if(!POLLS[cur]) return;
  if(!isOpen) say('投票已經截止，請看大螢幕。');
  else if(mine===null) say('請選一個答案，匿名作答。');
  else say('已收到，你選的是 <b>'+esc(POLLS[cur].options[mine])+'</b>。');
}
// 依後台回報的狀態更新畫面
function sync(s){
  if(!s || !s.ok) return;
  var id = s.active || s.poll || 'q1';
  var changed = id!==cur;
  if(changed) build(id);
  if(!POLLS[id]) return;
  isOpen = s.open!==false;
  if(changed || s.round!==round){
    round = s.round;
    var saved = (store.get('poll_choice_'+id)||'').split(':');
    mine = (String(s.round)===saved[0] && saved[1]!==undefined && saved[1]!=='') ? Number(saved[1]) : null;
  }
  if(!busy){ paint(); idle(); }
}
function send(i){
  if(busy || !isOpen || !POLLS[cur]) return;
  var id = cur, prev = mine; busy = true; mine = i; paint(); say('送出中…');
  post({action:'vote',token:token,choice:i,poll:id}).then(function(r){
    busy = false;
    if(cur!==id){ refresh(); return; }
    if(r && r.ok){ round = r.round; store.set('poll_choice_'+id, r.round+':'+i); paint(); idle(); }
    else {
      mine = prev;
      if(r && r.error==='not_active'){ say('題目已經換了，更新中…'); refresh(); }
      else if(r && r.error==='closed'){ isOpen = false; paint(); idle(); }
      else { paint(); say('沒有送出成功，請再點一次。'); }
    }
  }).catch(function(){ busy = false; mine = prev; paint(); say('網路不穩，沒有送出成功，請再點一次。'); });
}
function refresh(){
  clearTimeout(timer);
  getState().then(function(s){ fails = 0; sync(s); }).catch(function(){
    fails++; var w=document.getElementById('wait'); if(w) w.textContent='連線不穩，重試中…';
  }).then(function(){
    if(document.hidden) return;                       // 手機螢幕關閉或切到別的分頁時不輪詢
    timer = setTimeout(refresh, (fails>3 ? 8000 : 4000) + Math.random()*1500);
  });
}
document.addEventListener('visibilitychange',function(){ if(!document.hidden) refresh(); else clearTimeout(timer); });
refresh();
})();
</script>
</body>
</html>
